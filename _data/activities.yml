# Activities, shown in this order.

- title: Conferences
  text: Presentations at major international conferences (EURAM, AOM); a paper on AI in organizations at NMP.

- title: Events & training
  text: Annual international workshop with two keynote speakers, brown bag seminars, writing retreats, and methodology seminars open to junior faculty.

- title: Teaching innovation
  text: New courses on computational simulation, decision-making in complexity, and machine learning & LLMs for business students.

- title: Industry & stakeholder network
  text: Structured partnerships with Orange Innovation Research, Université Paris 1 Panthéon-Sorbonne and the University of Insubria, co-developing applied research agendas.
