# Seminar talks. The Seminars section stays hidden until this list has an entry.
# Talks sort themselves into "Upcoming" and "Past" by date, so you never need to move them.
# Required: date (YYYY-MM-DD), speaker, title. Optional: affiliation, url (speaker's page), abstract.
# For a long abstract, start it with ">" and indent the text on the following lines, as in the example.
# To add a talk, copy the example below, remove the "# " at the start of each line, and fill it in.

